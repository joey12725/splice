[build-system]
requires = ["hatchling>=1.17"]
build-backend = "hatchling.build"

[project]
name = "splice"
version = "0.2.0"
description = "Turn plain-English prompts into cached Python functions that run in a hardened sandbox."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joey Hersh" }]
keywords = ["llm", "code-generation", "sandbox", "cache", "openrouter", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
dev = [
  "pytest>=8",
  "mypy>=1.10",
  "ruff==0.17.5",
  "types-PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/joey12725/splice"
Source = "https://github.com/joey12725/splice"
Issues = "https://github.com/joey12725/splice/issues"
Changelog = "https://github.com/joey12725/splice/blob/main/CHANGELOG.md"

[project.scripts]
splice = "splice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["splice"]

[tool.hatch.build.targets.sdist]
include = ["splice", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]
ignore = ["SIM105", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["splice"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true
ignore_missing_imports = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: calls the live OpenRouter API (needs OPENROUTER_API_KEY and SPLICE_RUN_LIVE_TESTS=1)",
]
